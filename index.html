<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>GEOSAT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#dbe6f7; --bg2:#eef2fb; --bg3:#e7ecff;
    --blob1:#6ea8fe; --blob2:#b7a6ff; --blob3:#7ee0c0;
    --glass:rgba(255,255,255,0.55);
    --glass-strong:rgba(255,255,255,0.72);
    --stroke:rgba(255,255,255,0.7);
    --stroke-soft:rgba(120,140,190,0.18);
    --ink:#101f3d;
    --ink-2:#5a6b8c;
    --ink-3:#8493b4;
    --accent:#2f6bff;
    --accent-soft:rgba(47,107,255,0.14);
    --pos:#25c26e;
    --shadow:0 14px 40px rgba(30,55,120,0.16);
    --shadow-sm:0 6px 18px rgba(30,55,120,0.12);
  }
  body.dark{
    --bg1:#0a1230; --bg2:#0e1a3e; --bg3:#0a1636;
    --blob1:#2a52c9; --blob2:#5b3fb0; --blob3:#1f7a63;
    --glass:rgba(38,54,102,0.38);
    --glass-strong:rgba(46,64,120,0.5);
    --stroke:rgba(255,255,255,0.14);
    --stroke-soft:rgba(255,255,255,0.08);
    --ink:#eaf0ff;
    --ink-2:#a7b8de;
    --ink-3:#7688b3;
    --accent:#5688ff;
    --accent-soft:rgba(86,136,255,0.2);
    --pos:#33d17f;
    --shadow:0 16px 44px rgba(0,0,0,0.4);
    --shadow-sm:0 8px 20px rgba(0,0,0,0.32);
  }

  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:'Inter',system-ui,sans-serif;
    color:var(--ink);
    background:linear-gradient(160deg,var(--bg1),var(--bg2) 45%,var(--bg3));
    overflow:hidden;
    transition:background .6s ease,color .6s ease;
    position:relative;
  }
  /* soft colored blobs to give the glass something to refract */
  .blob{position:fixed;border-radius:50%;filter:blur(70px);opacity:.75;z-index:0;transition:background .6s ease;}
  .blob.b1{width:52vw;height:52vw;background:var(--blob1);top:-12vh;right:-14vw;}
  .blob.b2{width:46vw;height:46vw;background:var(--blob2);top:38vh;left:-18vw;opacity:.6;}
  .blob.b3{width:40vw;height:40vw;background:var(--blob3);bottom:-10vh;right:-8vw;opacity:.55;}

  .wrap{
    position:relative;z-index:1;
    height:100%;
    display:flex;flex-direction:column;
    gap:2.4vh;
    padding:6.5vh 5.5vw calc(3vh + env(safe-area-inset-bottom));
  }

  /* ---- top bar ---- */
  .topbar{display:flex;align-items:center;justify-content:space-between;}
  .brand{display:flex;align-items:center;gap:2.4vw;font-weight:700;letter-spacing:.14em;font-size:3.4vw;color:var(--ink-2);}
  .brand .logo{
    width:8.4vw;height:8.4vw;border-radius:32%;
    background:linear-gradient(140deg,var(--accent),#7aa2ff);
    display:flex;align-items:center;justify-content:center;color:#fff;
    box-shadow:var(--shadow-sm);
  }
  .brand .logo svg{width:52%;height:52%;}
  .theme-btn{
    border:1px solid var(--stroke);
    background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    color:var(--ink-2);font-family:inherit;font-weight:600;font-size:3vw;letter-spacing:.08em;
    padding:1.4vw 3.4vw;border-radius:999px;display:flex;align-items:center;gap:1.6vw;
    box-shadow:var(--shadow-sm);cursor:pointer;
  }

  /* ---- generic glass card ---- */
  .card{
    background:var(--glass);
    backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
    border:1px solid var(--stroke);
    border-radius:6vw;
    box-shadow:var(--shadow);
    padding:4.6vw;
    transition:background .6s ease,border-color .6s ease;
  }

  /* ---- hero (clock) ---- */
  .hero .greet{font-size:3.6vw;font-weight:500;color:var(--ink-2);letter-spacing:.02em;}
  .hero .time{font-size:15.5vw;font-weight:800;line-height:1;letter-spacing:-.02em;margin:.4vh 0 .2vh;}
  .hero .time .ampm{font-size:5vw;font-weight:600;color:var(--ink-3);margin-left:1.6vw;}
  .hero .date{font-size:3.7vw;font-weight:500;color:var(--ink-2);text-transform:capitalize;}

  /* ---- current weather ---- */
  .now{display:flex;align-items:center;gap:4.4vw;}
  .now .ico{width:18vw;height:18vw;flex:none;color:var(--accent);}
  .now .ico svg{width:100%;height:100%;}
  .now .temp{font-size:13vw;font-weight:800;line-height:.95;}
  .now .temp sup{font-size:5vw;font-weight:600;vertical-align:top;top:1.4vw;position:relative;color:var(--ink-3);}
  .now .desc{font-size:3.8vw;font-weight:500;color:var(--ink-2);}
  .now .metrics{margin-left:auto;text-align:right;display:flex;flex-direction:column;gap:1.2vh;}
  .now .metrics div{font-size:3.4vw;color:var(--ink-2);font-weight:500;}
  .now .metrics b{color:var(--ink);font-weight:700;}
  .now .city{font-size:3.2vw;color:var(--ink-3);font-weight:500;margin-top:.4vh;}

  /* ---- week forecast ---- */
  .sect-title{font-size:2.9vw;font-weight:700;letter-spacing:.18em;color:var(--ink-3);text-transform:uppercase;margin-bottom:2vh;}
  .week{display:flex;justify-content:space-between;gap:1.5vw;}
  .day{flex:1;display:flex;flex-direction:column;align-items:center;gap:1vh;padding:1.2vh 0;border-radius:4vw;transition:background .4s;}
  .day.today{background:var(--accent-soft);}
  .day .dname{font-size:3vw;font-weight:600;color:var(--ink-2);text-transform:capitalize;}
  .day .dico{width:7.6vw;height:7.6vw;color:var(--accent);}
  .day .dico svg{width:100%;height:100%;}
  .day .dmax{font-size:3.4vw;font-weight:700;}
  .day .dmin{font-size:3vw;font-weight:500;color:var(--ink-3);}

  /* ---- mini calendar ---- */
  .cal-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:1.6vh;}
  .cal-head .m{font-size:4.4vw;font-weight:700;text-transform:capitalize;}
  .cal-head .y{font-size:3.4vw;font-weight:500;color:var(--ink-3);}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:.6vh 0;text-align:center;}
  .cal-grid .wd{font-size:2.7vw;font-weight:700;color:var(--ink-3);text-transform:uppercase;padding-bottom:.6vh;}
  .cal-grid .d{font-size:3.5vw;font-weight:500;color:var(--ink);padding:1vh 0;position:relative;}
  .cal-grid .d.mut{color:var(--ink-3);opacity:.4;}
  .cal-grid .d.today{color:#fff;font-weight:700;}
  .cal-grid .d.today::before{
    content:"";position:absolute;inset:.4vh 22%;border-radius:50%;
    background:var(--accent);z-index:-1;box-shadow:0 4px 12px var(--accent-soft);
  }

  /* ---- accesos ---- */
  .accesos{margin-top:auto;}
  .apps{display:flex;justify-content:space-between;gap:3.4vw;}
  .app{
    flex:1;aspect-ratio:1;border-radius:5vw;
    background:var(--glass-strong);
    border:1px dashed var(--stroke-soft);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    box-shadow:var(--shadow-sm);
  }

  footer{
    text-align:center;font-size:2.6vw;letter-spacing:.14em;color:var(--ink-3);
    font-weight:500;text-transform:uppercase;
  }
  footer b{color:var(--ink-2);font-weight:700;}
</style>
</head>
<body>
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>

  <div class="wrap">
    <div class="topbar">
      <div class="brand">
        <span class="logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/>
          </svg>
        </span>
        GEOSAT
      </div>
      <button class="theme-btn" id="themeBtn">◐ AUTO</button>
    </div>

    <!-- clock -->
    <div class="card hero">
      <div class="greet" id="greet">Bienvenido</div>
      <div class="time" id="time">--:--</div>
      <div class="date" id="date">Cargando fecha…</div>
    </div>

    <!-- current weather -->
    <div class="card now">
      <div class="ico" id="nowIco"></div>
      <div>
        <div class="temp" id="nowTemp">--<sup>°</sup></div>
        <div class="desc" id="nowDesc">Cargando clima…</div>
      </div>
      <div class="metrics">
        <div>Humedad <b id="nowHum">--%</b></div>
        <div>Viento <b id="nowWind">-- km/h</b></div>
        <div class="city" id="nowCity">—</div>
      </div>
    </div>

    <!-- week forecast -->
    <div class="card">
      <div class="sect-title">Pronóstico · 7 días</div>
      <div class="week" id="week"></div>
    </div>

    <!-- mini calendar -->
    <div class="card">
      <div class="cal-head">
        <span class="m" id="calMonth">—</span>
        <span class="y" id="calYear"></span>
      </div>
      <div class="cal-grid" id="cal"></div>
    </div>

    <!-- app shortcuts -->
    <div class="accesos">
      <div class="sect-title">Accesos</div>
      <div class="apps">
        <div class="app"></div><div class="app"></div><div class="app"></div><div class="app"></div>
      </div>
    </div>

    <footer>Estación <b>METEO-SAT</b> · <span id="coords">LAT --- LONG ---</span></footer>
  </div>

<script>
/* ---------- weather icons (WMO) ---------- */
const I = {
  sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 1.5v2.6M12 19.9v2.6M1.5 12h2.6M19.9 12h2.6M4.6 4.6l1.9 1.9M17.5 17.5l1.9 1.9M19.4 4.6l-1.9 1.9M6.5 17.5l-1.9 1.9"/></svg>',
  part:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="3.2"/><path d="M8 1.8v1.8M1.8 8h1.8M3.9 3.9l1.3 1.3M12.1 3.9l-1.3 1.3"/><path d="M17.5 13a4 4 0 0 0-7.7-1.3A3.3 3.3 0 0 0 7 18h10.2a2.9 2.9 0 0 0 .3-5z" fill="currentColor" fill-opacity=".14"/></svg>',
  cloud:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M17.5 18a3.4 3.4 0 0 0 .3-6.8 5 5 0 0 0-9.6-1.3A3.9 3.9 0 0 0 7 18z" fill="currentColor" fill-opacity=".14"/></svg>',
  rain:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 14a3.4 3.4 0 0 0 .3-6.8 5 5 0 0 0-9.6-1.3A3.9 3.9 0 0 0 7 14z" fill="currentColor" fill-opacity=".12"/><path d="M8 18l-1 2M12 18l-1 2M16 18l-1 2"/></svg>',
  storm:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 13a3.4 3.4 0 0 0 .3-6.8 5 5 0 0 0-9.6-1.3A3.9 3.9 0 0 0 7 13z" fill="currentColor" fill-opacity=".12"/><path d="M12 13l-2.4 4h3l-2 4"/></svg>',
  snow:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 13a3.4 3.4 0 0 0 .3-6.8 5 5 0 0 0-9.6-1.3A3.9 3.9 0 0 0 7 13z" fill="currentColor" fill-opacity=".12"/><path d="M9 18h.01M12 20h.01M15 18h.01M12 17h.01"/></svg>',
  fog:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 9h16M4 13h16M6 17h12M6 5h12"/></svg>'
};
function wmo(code){
  if(code===0) return {i:'sun',t:'Despejado'};
  if(code===1||code===2) return {i:'part',t:'Parcial'};
  if(code===3) return {i:'cloud',t:'Nublado'};
  if(code===45||code===48) return {i:'fog',t:'Niebla'};
  if(code>=51&&code<=67) return {i:'rain',t:'Llovizna'};
  if(code>=71&&code<=77) return {i:'snow',t:'Nieve'};
  if(code>=80&&code<=82) return {i:'rain',t:'Chubascos'};
  if(code>=85&&code<=86) return {i:'snow',t:'Nieve'};
  if(code>=95) return {i:'storm',t:'Tormenta'};
  return {i:'cloud',t:'—'};
}

/* ---------- theme ---------- */
const MODES=['auto','light','dark'], LBL={auto:'◐ AUTO',light:'☀ CLARO',dark:'☾ OSCURO'};
let mode = localStorage.getItem('geo_theme') || 'auto';
function applyTheme(){
  let dark;
  if(mode==='auto'){const h=new Date().getHours(); dark = (h<7||h>=18);}
  else dark = (mode==='dark');
  document.body.classList.toggle('dark',dark);
  document.getElementById('themeBtn').textContent = LBL[mode];
}
document.getElementById('themeBtn').addEventListener('click',()=>{
  mode = MODES[(MODES.indexOf(mode)+1)%3];
  localStorage.setItem('geo_theme',mode); applyTheme();
});

/* ---------- clock ---------- */
function tick(){
  const n=new Date();
  let h=n.getHours(); const m=String(n.getMinutes()).padStart(2,'0');
  const ampm = h<12?'AM':'PM'; let h12=h%12; if(h12===0)h12=12;
  document.getElementById('time').innerHTML = h12+':'+m+'<span class="ampm">'+ampm+'</span>';
  const hh = n.getHours();
  document.getElementById('greet').textContent = hh<12?'Buenos días':(hh<19?'Buenas tardes':'Buenas noches');
  document.getElementById('date').textContent =
    n.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});
  if(mode==='auto') applyTheme();
}

/* ---------- calendar ---------- */
function buildCal(){
  const n=new Date(), y=n.getFullYear(), mo=n.getMonth(), today=n.getDate();
  document.getElementById('calMonth').textContent =
    n.toLocaleDateString('es-ES',{month:'long'});
  document.getElementById('calYear').textContent = y;
  const grid=document.getElementById('cal'); grid.innerHTML='';
  ['L','M','X','J','V','S','D'].forEach(d=>{
    const e=document.createElement('div'); e.className='wd'; e.textContent=d; grid.appendChild(e);
  });
  const first=new Date(y,mo,1); let start=(first.getDay()+6)%7; // Monday=0
  const days=new Date(y,mo+1,0).getDate();
  const prev=new Date(y,mo,0).getDate();
  for(let i=0;i<start;i++){const e=document.createElement('div');e.className='d mut';e.textContent=prev-start+1+i;grid.appendChild(e);}
  for(let d=1;d<=days;d++){
    const e=document.createElement('div'); e.className='d'+(d===today?' today':''); e.textContent=d; grid.appendChild(e);
  }
  const total=start+days, rest=(7-(total%7))%7;
  for(let i=1;i<=rest;i++){const e=document.createElement('div');e.className='d mut';e.textContent=i;grid.appendChild(e);}
}

/* ---------- weather ---------- */
async function loadWeather(){
  let lat=-23.55, lon=-46.63, city='—';
  try{
    const g=await fetch('https://ipwho.is/').then(r=>r.json());
    if(g&&g.success){lat=g.latitude;lon=g.longitude;city=g.city||g.region||'—';}
  }catch(e){}
  document.getElementById('nowCity').textContent = city;
  document.getElementById('coords').textContent =
    'LAT '+lat.toFixed(2)+' LONG '+lon.toFixed(2);
  try{
    const url='https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+
      '&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m'+
      '&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=7';
    const w=await fetch(url).then(r=>r.json());
    const c=w.current, cw=wmo(c.weather_code);
    document.getElementById('nowTemp').innerHTML = Math.round(c.temperature_2m)+'<sup>°</sup>';
    document.getElementById('nowDesc').textContent = cw.t;
    document.getElementById('nowIco').innerHTML = I[cw.i];
    document.getElementById('nowHum').textContent = c.relative_humidity_2m+'%';
    document.getElementById('nowWind').textContent = Math.round(c.wind_speed_10m)+' km/h';
    // week
    const dn=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
    const wk=document.getElementById('week'); wk.innerHTML='';
    for(let i=0;i<7;i++){
      const dt=new Date(w.daily.time[i]+'T00:00');
      const dw=wmo(w.daily.weather_code[i]);
      const el=document.createElement('div'); el.className='day'+(i===0?' today':'');
      el.innerHTML='<div class="dname">'+(i===0?'Hoy':dn[dt.getDay()])+'</div>'+
        '<div class="dico">'+I[dw.i]+'</div>'+
        '<div class="dmax">'+Math.round(w.daily.temperature_2m_max[i])+'°</div>'+
        '<div class="dmin">'+Math.round(w.daily.temperature_2m_min[i])+'°</div>';
      wk.appendChild(el);
    }
  }catch(e){
    document.getElementById('nowDesc').textContent='Sin conexión';
  }
}

/* ---------- init ---------- */
applyTheme(); tick(); buildCal(); loadWeather();
setInterval(tick,1000);
setInterval(loadWeather,15*60*1000);
setInterval(buildCal,60*60*1000);
</script>
</body>
</html>
